[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "rigload"
description = "Fast, calibration-aware multi-modal (RGB-D) data loader with a Rust core"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.maturin]
manifest-path = "crates/rigload-py/Cargo.toml"
python-source = "python"
module-name = "rigload._rigload"
# Set only for maturin builds, so plain `cargo test` still links libpython normally.
features = ["pyo3/extension-module"]
