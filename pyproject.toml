[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "rigload"
description = "Fast, calibration-aware multi-modal (RGB-D) data loader with a Rust core"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
# numpy + pillow: tools/gen_synthetic.py and its tests.
test = ["pytest", "numpy", "pillow"]
# Baselines + harness (bench/). albumentationsx is AGPL-3.0: bench-only, never imported by rigload.
bench = ["torch", "torchvision", "albumentationsx[headless]", "psutil", "numpy", "pillow"]

[tool.pytest.ini_options]
# torchvision.io decode is deprecated since 0.29 but still used by the baseline (see bench/baseline_torch.py).
filterwarnings = ["ignore:The image decoding:DeprecationWarning"]

[tool.maturin]
manifest-path = "crates/rigload-py/Cargo.toml"
python-source = "python"
module-name = "rigload._rigload"
# Set only for maturin builds, so plain `cargo test` still links libpython normally.
features = ["pyo3/extension-module"]
