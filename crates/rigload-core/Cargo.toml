[package]
name = "rigload-core"
description = "Pure-Rust core of rigload: manifest, decode, transforms, pipeline (no Python dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# manifest.jsonl parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# JPEG (zune-jpeg inside) + PNG (incl. 16-bit) decode; only the two formats we read
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# work-stealing thread pool: decodes a batch's samples in parallel
rayon = "1"
# SIMD crop + antialiased resize for RGB (Step 6); its default feature is just `std`
fast_image_resize = "6"

[dev-dependencies]
# decode micro-benchmarks; no plots, no rayon
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# property tests for the calibration-consistency rules (CLAUDE.md §5)
proptest = "1"

[[bench]]
name = "decode"
harness = false
